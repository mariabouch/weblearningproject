<!DOCTYPE html>
<html lang="fr">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Login - SHINE WITH US</title>
   <link rel="stylesheet" href="../pagescss/login.css">


</head>

<body class="login-body">
   <div class="login-page-wrapper">
      <div class="login-card">
         <div class="login-image-section">
            <img src="../assets/login.jpg">
            <!-- faut toujours ajouter alt attribut pour les images, c important pour le SEO (serch about it) -->
         </div>

         <div class="login-form-section">
            <h2>Login</h2>
            <form action="#" method="post">
               <div class="input-field">
                  <label for="email">Email</label>
                  <div class="input-wrapper">
                     <input type="email" id="email" name="email" required>
                     <span class="icon">&#9993;
                  </div>
               </div>
               <div class="input-field">
                  <label for="password">Password</label>
                  <div class="input-wrapper">
                     <input type="password" id="password" name="password" required>
                     <span class="icon">&#128274;</span>
                  </div>
               </div>
               <button type="submit" class="login-submit-btn">Login</button>
               <div class="login-links">
                  <a href="Signup.html" class="create-account">Create an account</a>
                  <a href="#" class="forgot-password">Forgot password</a>
               </div>
            </form>
         </div>
      </div>
   </div>

</body>

</html>
